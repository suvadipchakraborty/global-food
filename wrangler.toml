name = "global-food"
main = "src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Serves everything in ./public as static assets. Requests that don't match
# a file on disk fall through to the Worker's fetch handler in src/worker.js,
# which is how /api/* stays dynamic while index.html, css, js, and icons are
# served straight from the edge.
[assets]
directory = "./public"
binding = "ASSETS"

# ---------------------------------------------------------------------------
# Secrets (never commit real keys — set them via the CLI or the Cloudflare
# dashboard instead):
#
#   wrangler secret put SPOONACULAR_API_KEY
#   wrangler secret put RESTCOUNTRIES_API_KEY
#
# Get a free Spoonacular key at https://spoonacular.com/food-api
# Get a free REST Countries key at https://restcountries.com/sign-up
#   (REST Countries retired its old open v1–v4 endpoints; v5 requires a key.
#   Without RESTCOUNTRIES_API_KEY set, the Worker falls back to the public
#   rc_live_demo key, which is fine for testing but rate-limited.)
# The Worker reads them as env.SPOONACULAR_API_KEY / env.RESTCOUNTRIES_API_KEY
# (see src/worker.js).
# ---------------------------------------------------------------------------

[vars]
# Non-secret configuration can go here if you need it later, e.g.:
# ENVIRONMENT = "production"
